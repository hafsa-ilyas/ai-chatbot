<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI ChatBot</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header>
      <div class="header-row">
        <div>
          <h1>AI ChatBot</h1>
          <!-- <p class="subtitle">Name → Time → Age</p> -->
        </div>
        <button type="button" id="new-chat-btn" class="new-chat-btn">New chat</button>
      </div>
      <div id="timer" class="timer" hidden>
        <span class="timer-label">Time left</span>
        <span id="timer-value" class="timer-value">0:00</span>
      </div>
    </header>
    <main id="chat" class="chat" aria-live="polite"></main>
    <form id="chat-form" class="chat-form">
      <input
        id="message-input"
        type="text"
        placeholder="Type your message..."
        autocomplete="off"
        required
      />
      <button type="submit" id="send-btn">Send</button>
    </form>
  </div>
  <script src="app.js"></script>
</body>
</html>
